name: Rust
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
          libfontconfig1-dev libfreetype6-dev libvulkan-dev libudev-dev
          libx11-dev libx11-xcb-dev libxi-dev libxrender-dev libxrandr-dev
          libxcb1-dev libxcb-composite0-dev libxcb-randr0-dev
          libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - run: cargo run --locked -- --version
