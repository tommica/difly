[package]
name = "difly"
version = "0.1.3"
edition = "2024"
description = "A focused Git commit and merge editor"
license = "BSD-3-Clause"

[features]
default = ["gui"]
gui = ["dep:gpui-kit"]
ui-tests = ["gui"]

[[bin]]
name = "difly"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1"
gpui-kit = { version = "=0.9.0", features = ["syntect"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
ron = "0.11"
similar = "2.7"
tempfile = "3"

[build-dependencies]
resvg = { version = "0.45", default-features = false }

[dev-dependencies]
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }

[profile.release]
lto = "thin"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }

[[test]]
name = "ui_workflow"
path = "tests/ui_workflow.rs"
harness = false
required-features = ["ui-tests"]
