[package]
name = "difly"
version = "0.1.1"
edition = "2024"
description = "A focused Git commit and merge editor"
license = "MIT"

[dependencies]
anyhow = "1"
eframe = { version = "0.33", features = ["persistence"] }
similar = "2.7"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tempfile = "3"

[build-dependencies]
resvg = { version = "0.45", default-features = false }

[dev-dependencies]

[profile.release]
lto = "thin"
strip = true
